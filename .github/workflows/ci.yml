name: CI

on:
  pull_request:
    branches: [main, devel, "release/**"]

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
          - ros_distro: jazzy
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-${{ matrix.ros_distro }}-ament-cpplint \
            ros-${{ matrix.ros_distro }}-ament-flake8 \
            ros-${{ matrix.ros_distro }}-ament-pep257 \
            ros-${{ matrix.ros_distro }}-ament-xmllint \
            cppcheck

      - name: ament_cpplint
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_cpplint wmx_r2_package/src wmx_r2_package/include
          ament_cpplint wmx_r2_control/src wmx_r2_control/include

      - name: ament_flake8 (launch + tests)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_flake8 wmx_r2_package/launch wmx_r2_package/test
          ament_flake8 wmx_r2_control/launch

      - name: ament_xmllint (package.xml)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_xmllint wmx_r2_package/package.xml wmx_r2_message/package.xml
          ament_xmllint wmx_r2_control/package.xml \
            wmx_r2_control/wmx_r2_control_plugin.xml

      - name: cppcheck (warnings only, never fails the job)
        run: |
          cppcheck --enable=warning,style --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=0 \
            wmx_r2_package/src wmx_r2_control/src

  build-messages:
    name: Build wmx_r2_message (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
          - ros_distro: jazzy
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/wmx-r2

      - name: rosdep install
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro ${{ matrix.ros_distro }} \
            --skip-keys "wmx_r2_package movensys_navigation_description movensys_manipulator_description"

      - name: colcon build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select wmx_r2_message \
            --event-handlers console_cohesion+

      - name: colcon test (message interfaces only)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          colcon test --packages-select wmx_r2_message \
            --event-handlers console_cohesion+
          colcon test-result --verbose

  build-control:
    name: Build wmx_r2_control (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
          - ros_distro: jazzy
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/wmx-r2

      - name: rosdep install
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths src/wmx-r2/wmx_r2_control --ignore-src -y \
            --rosdistro ${{ matrix.ros_distro }} \
            --skip-keys "wmx_r2_package movensys_navigation_description movensys_manipulator_description"

      # The WMX3 SDK cannot be installed on a runner, so the wmx_system_hardware
      # plugin is skipped by the EXISTS guard in CMakeLists.txt. What this job
      # does cover is that the package configures without the SDK and that the
      # SDK-free unit tests (cyclic-buffer stream timing) build and pass.
      #
      # wmx_r2_package's gtests could join this job the same way once its
      # WMX-linked targets get an equivalent guard.
      - name: colcon build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select wmx_r2_control \
            --event-handlers console_cohesion+

      - name: colcon test
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          colcon test --packages-select wmx_r2_control \
            --event-handlers console_cohesion+
          colcon test-result --verbose

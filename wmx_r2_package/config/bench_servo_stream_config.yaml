# Single-axis bench config for characterising the buffered Servo streaming path.
#
# Drives a standalone bench session — servo_stream_controller plus the
# joint_state_broadcaster it needs for feedback — without MoveIt, IK, or a
# six-axis arm in the loop. See doc/reference_servo_stream_controller.md.
#
# This is a BRING-UP and MEASUREMENT config, not a robot config: the robot
# configs (cr3a/cr5a_manipulator_config.yaml) are what the launch files use.
# Point ros2 run at this file directly from the source tree so it can be edited
# and re-run without a rebuild.

servo_stream_controller:
  ros__parameters:
    joint_axes: [0]
    # Order matters: axis[0] determines LinearIntplProfileCalcMode for the
    # whole interpolation.
    joint_name: ["joint1"]
    joint_trajectory_topic: /movensys_manipulator_arm_controller/joint_trajectory

    api_buffer_channel: 0
    estop_buffer_channel: 1      # watch trigger routine; must differ from the above
    # 396 bytes/setpoint measured by api_buffer_probe, so 1 MB holds ~2650
    # setpoints = ~66 s of stream at 40 Hz.
    api_buffer_size_mb: 1

    # Queue depth is the latency/robustness dial: 1 setpoint = 25 ms at 40 Hz.
    target_queue_depth: 2
    nominal_period_us: 25000     # must equal the publisher's period
    period_clamp_lo_us: 20000    # pacing authority, +/-20%
    period_clamp_hi_us: 30000
    pacing_kp: 0.15              # 150 us of correction per setpoint of depth error

    ros_queue_depth: 8           # drop-oldest above this; stale teleop is worthless
    starvation_timeout_ms: 75    # 3x nominal period -> controlled stop
    accel_ratio: 0.3
    stop_on_error: true

# Publishes /joint_states, which servo_stream_test_source needs to centre its
# waveform on and which every measurement of the streaming path depends on.
# NOT started by wmx_r2_general_nodes.launch.py — the manipulator launches add
# it, so a bench session has to run it by hand.
joint_state_broadcaster:
  ros__parameters:
    joint_axes: [0]
    joint_name: ["joint1"]
    joint_feedback_rate: 100
    encoder_joint_topic: /joint_states
    isaacsim_joint_topic: /isaacsim/joint_command
    gazebo_joint_topic: /gazebo_position_controller/commands

# Synthetic stand-in for MoveIt Servo. amplitude_rad 0.0 is a pure hold: the full
# streaming path runs at rate with zero commanded motion, which is the correct
# first test with the servos on. Raise it only once queue depth is stable.
servo_stream_test_source:
  ros__parameters:
    joint_name: ["joint1"]
    joint_states_topic: /joint_states
    output_topic: /movensys_manipulator_arm_controller/joint_trajectory
    amplitude_rad: 0.0
    frequency_hz: 0.25
    publish_rate_hz: 40.0
    ramp_seconds: 2.0
    waveform: sine

# Run-once buffer characterisation. Commands no motion; safe with servos off,
# and that is the recommended way to run it.
api_buffer_probe:
  ros__parameters:
    joint_axes: [0]
    api_buffer_channel: 0
    api_buffer_size_mb: 1
    sample_count: 100
    sleep_sample_count: 50

controller_manager:
  ros__parameters:
    # NOTE: interval_cycles in the ros2_control xacro must equal
    #   (WMX RT cycle rate Hz) / update_rate. With a 1 kHz WMX engine and
    #   update_rate=100, interval_cycles=10.
    update_rate: 100
    use_sim_time: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Name matches MoveIt's moveit_controllers.yaml entry so the
    # follow_joint_trajectory action resolves to
    #   /movensys_manipulator_arm_controller/follow_joint_trajectory
    movensys_manipulator_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

movensys_manipulator_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # WMX already enforces axis-level limits; keep the controller tolerant.
    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
